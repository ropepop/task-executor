name: Operation Queue Drain

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: Current backlog chain depth (0 for manual/scheduled runs)
        required: false
        default: '0'
      chain_origin:
        description: Origin marker for run continuity telemetry
        required: false
        default: manual

permissions:
  actions: write
  contents: read

concurrency:
  group: operation-queue-drain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          STALLED_RUNNER_BASE_URL: ${{ secrets.STALLED_RUNNER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STALLED_RUNNER_BASE_URL:-}" ]; then
            echo "Missing required GitHub secret: STALLED_RUNNER_BASE_URL"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing required GitHub secret: CRON_SECRET"
            exit 1
          fi

      - name: Drain operation queue
        env:
          STALLED_RUNNER_BASE_URL: ${{ secrets.STALLED_RUNNER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          CHAIN_DEPTH_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chain_depth || '0' }}
          CHAIN_ORIGIN_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chain_origin || github.event_name }}
        run: |
          set -euo pipefail

          drain_url="${STALLED_RUNNER_BASE_URL%/}/api/internal/pipeline/operations/actions/drain"
          response_file="$(mktemp)"
          chain_depth_raw="${CHAIN_DEPTH_INPUT:-0}"
          if [[ "${chain_depth_raw}" =~ ^[0-9]+$ ]]; then
            chain_depth="${chain_depth_raw}"
          else
            chain_depth=0
          fi
          chain_origin="${CHAIN_ORIGIN_INPUT:-manual}"

          status_code="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 120 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "Content-Type: application/json" \
              --header "X-Cron-Source: task-executor" \
              --header "X-Cron-Run-Id: ${GITHUB_RUN_ID}" \
              --header "X-Cron-Event: ${GITHUB_EVENT_NAME}" \
              --header "X-Cron-Chain-Depth: ${chain_depth}" \
              "${drain_url}"
          )"

          echo "Drain status: ${status_code}"
          cat "${response_file}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Operation queue drain failed"
            exit 1
          fi

          before_pending="$(jq -r '(.data.before.pendingCount // .before.pendingCount // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          before_dispatched="$(jq -r '(.data.before.dispatchedCount // .before.dispatchedCount // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          before_stalled_total="$(jq -r '(.data.before.stalledTotal // .before.stalledTotal // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          before_never_dispatched="$(jq -r '(.data.before.neverDispatchedCount // .before.neverDispatchedCount // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          after_pending="$(jq -r '(.data.after.pendingCount // .after.pendingCount // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          after_dispatched="$(jq -r '(.data.after.dispatchedCount // .after.dispatchedCount // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          after_stalled_total="$(jq -r '(.data.after.stalledTotal // .after.stalledTotal // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          after_never_dispatched="$(jq -r '(.data.after.neverDispatchedCount // .after.neverDispatchedCount // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          processed_estimate="$(jq -r '(.data.processedEstimate // .processedEstimate // 0) | tonumber? // 0' "${response_file}" 2>/dev/null || echo 0)"
          progress_hint="$(jq -r 'if (.data.progressHint // .progressHint) == true then "true" elif (.data.progressHint // .progressHint) == false then "false" else "unset" end' "${response_file}" 2>/dev/null || echo unset)"

          before_backlog=$((before_pending + before_dispatched))
          after_backlog=$((after_pending + after_dispatched))
          max_chain_depth=24
          should_chain=false
          decision_reason=""
          progress_made=false
          progress_signal="none"

          if [ "${progress_hint}" = "true" ]; then
            progress_made=true
            progress_signal="progressHint=true"
          elif [ "${progress_hint}" = "false" ]; then
            progress_signal="progressHint=false"
          elif [ "${processed_estimate}" -gt 0 ]; then
            progress_made=true
            progress_signal="processedEstimate>0"
          elif [ "${before_backlog}" -gt "${after_backlog}" ]; then
            progress_made=true
            progress_signal="backlog_decreased"
          elif [ "${before_stalled_total}" -gt "${after_stalled_total}" ]; then
            progress_made=true
            progress_signal="stalledTotal_decreased"
          elif [ "${before_never_dispatched}" -gt "${after_never_dispatched}" ]; then
            progress_made=true
            progress_signal="neverDispatched_decreased"
          fi

          if [ "${after_backlog}" -le 0 ]; then
            decision_reason="No backlog remains after drain"
          elif [ "${chain_depth}" -ge "${max_chain_depth}" ]; then
            decision_reason="Maximum chain depth reached (${chain_depth}/${max_chain_depth})"
          elif [ "${progress_made}" != "true" ]; then
            decision_reason="Backlog remains but no progress signal (${progress_signal})"
          else
            should_chain=true
            decision_reason="Backlog remains and progress made (${progress_signal})"
          fi

          echo "Backlog before: ${before_backlog} (pending=${before_pending}, dispatched=${before_dispatched})"
          echo "Backlog after: ${after_backlog} (pending=${after_pending}, dispatched=${after_dispatched})"
          echo "Stalled total before: ${before_stalled_total}"
          echo "Stalled total after: ${after_stalled_total}"
          echo "Never-dispatched before: ${before_never_dispatched}"
          echo "Never-dispatched after: ${after_never_dispatched}"
          echo "Processed estimate: ${processed_estimate}"
          echo "Progress hint: ${progress_hint}"
          echo "Progress signal: ${progress_signal}"
          echo "Chain context: depth=${chain_depth}, origin=${chain_origin}"
          echo "Chain decision: ${should_chain} (${decision_reason})"

          {
            echo "### Operation Queue Drain Summary"
            echo ""
            echo "- HTTP status: \`${status_code}\`"
            echo "- Backlog before: \`${before_backlog}\` (pending=\`${before_pending}\`, dispatched=\`${before_dispatched}\`)"
            echo "- Backlog after: \`${after_backlog}\` (pending=\`${after_pending}\`, dispatched=\`${after_dispatched}\`)"
            echo "- Stalled total before: \`${before_stalled_total}\`"
            echo "- Stalled total after: \`${after_stalled_total}\`"
            echo "- Never-dispatched before: \`${before_never_dispatched}\`"
            echo "- Never-dispatched after: \`${after_never_dispatched}\`"
            echo "- Processed estimate: \`${processed_estimate}\`"
            echo "- Progress hint: \`${progress_hint}\`"
            echo "- Progress signal: \`${progress_signal}\`"
            echo "- Chain depth: \`${chain_depth}\` (max \`${max_chain_depth}\`)"
            echo "- Chain origin: \`${chain_origin}\`"
            echo "- Chain decision: \`${should_chain}\`"
            echo "- Decision reason: ${decision_reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${should_chain}" != "true" ]; then
            exit 0
          fi

          next_chain_depth=$((chain_depth + 1))
          dispatch_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stalled-runner-cron.yml/dispatches"
          dispatch_response_file="$(mktemp)"
          dispatch_payload="$(
            jq -n \
              --arg ref "${GITHUB_REF_NAME}" \
              --arg chain_depth "${next_chain_depth}" \
              --arg chain_origin "auto-backlog" \
              '{ref:$ref, inputs:{chain_depth:$chain_depth, chain_origin:$chain_origin}}'
          )"

          dispatch_status="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "${dispatch_response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "${dispatch_payload}" \
              "${dispatch_url}"
          )"

          echo "Self-dispatch status: ${dispatch_status}"
          if [ -s "${dispatch_response_file}" ]; then
            cat "${dispatch_response_file}"
          fi

          if [ "${dispatch_status}" -lt 200 ] || [ "${dispatch_status}" -ge 300 ]; then
            {
              echo "- Self-dispatch status: \`${dispatch_status}\`"
              echo "- Self-dispatch result: failed"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Self-dispatch failed"
            exit 1
          fi

          {
            echo "- Self-dispatch status: \`${dispatch_status}\`"
            echo "- Self-dispatch result: queued next worker with \`chain_depth=${next_chain_depth}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
