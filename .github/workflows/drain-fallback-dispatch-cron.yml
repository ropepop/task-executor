name: Drain Fallback Dispatch

on:
  schedule:
    - cron: '1-59/10 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  dispatch-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          STALLED_RUNNER_BASE_URL: ${{ secrets.STALLED_RUNNER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STALLED_RUNNER_BASE_URL:-}" ]; then
            echo "Missing required GitHub secret: STALLED_RUNNER_BASE_URL"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing required GitHub secret: CRON_SECRET"
            exit 1
          fi

      - name: Preflight guard for fallback dispatch
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FALLBACK_COOLDOWN_MINUTES: '6'
        run: |
          set -euo pipefail

          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stalled-runner-cron.yml/runs?per_page=20"
          runs_file="$(mktemp)"

          curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --output "${runs_file}" \
            --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${runs_url}" >/dev/null

          active_count="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' "${runs_file}")"
          if [ "${active_count}" -gt 0 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "reason=active_or_pending_drain_run" >> "${GITHUB_OUTPUT}"
            echo "Skipping fallback: ${active_count} drain run(s) are active/pending"
            {
              echo "### Drain Fallback Dispatch Summary"
              echo ""
              echo "- Preflight skip: \`true\`"
              echo "- Reason: active_or_pending_drain_run"
              echo "- Active/pending drain runs: \`${active_count}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          latest_completed_updated_at="$(jq -r '[.workflow_runs[] | select(.status == "completed") | .updated_at] | first // ""' "${runs_file}")"
          if [ -n "${latest_completed_updated_at}" ]; then
            now_epoch="$(date +%s)"
            latest_epoch="$(date -d "${latest_completed_updated_at}" +%s)"
            age_sec=$((now_epoch - latest_epoch))
            cooldown_sec=$((FALLBACK_COOLDOWN_MINUTES * 60))

            if [ "${age_sec}" -lt "${cooldown_sec}" ]; then
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              echo "reason=recent_completed_drain_run" >> "${GITHUB_OUTPUT}"
              echo "Skipping fallback: latest completed drain run ended ${age_sec}s ago"
              {
                echo "### Drain Fallback Dispatch Summary"
                echo ""
                echo "- Preflight skip: \`true\`"
                echo "- Reason: recent_completed_drain_run"
                echo "- Cooldown minutes: \`${FALLBACK_COOLDOWN_MINUTES}\`"
                echo "- Latest completed run age seconds: \`${age_sec}\`"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "reason=passed" >> "${GITHUB_OUTPUT}"

      - name: Dispatch fallback drain workflow if needed
        if: steps.preflight.outputs.skip != 'true'
        env:
          STALLED_RUNNER_BASE_URL: ${{ secrets.STALLED_RUNNER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
        run: |
          set -euo pipefail

          fallback_url="${STALLED_RUNNER_BASE_URL%/}/api/internal/task-executor/fallback/dispatch-drain"
          response_file="$(mktemp)"

          status_code="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 120 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "Content-Type: application/json" \
              "${fallback_url}"
          )"

          echo "Fallback dispatch status: ${status_code}"
          cat "${response_file}"

          {
            echo "### Drain Fallback Dispatch Summary"
            echo ""
            echo "- Preflight skip: \`false\`"
            echo "- Reason: ${PREFLIGHT_REASON:-passed}"
            echo "- Endpoint status: \`${status_code}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Fallback dispatch endpoint failed"
            exit 1
          fi
