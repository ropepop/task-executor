name: Drain Fallback Dispatch

on:
  schedule:
    - cron: '1-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          STALLED_RUNNER_BASE_URL: ${{ secrets.STALLED_RUNNER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STALLED_RUNNER_BASE_URL:-}" ]; then
            echo "Missing required GitHub secret: STALLED_RUNNER_BASE_URL"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing required GitHub secret: CRON_SECRET"
            exit 1
          fi

      - name: Dispatch fallback drain workflow if needed
        env:
          STALLED_RUNNER_BASE_URL: ${{ secrets.STALLED_RUNNER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          fallback_url="${STALLED_RUNNER_BASE_URL%/}/api/internal/task-executor/fallback/dispatch-drain"
          response_file="$(mktemp)"

          status_code="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 120 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "Content-Type: application/json" \
              "${fallback_url}"
          )"

          echo "Fallback dispatch status: ${status_code}"
          cat "${response_file}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Fallback dispatch endpoint failed"
            exit 1
          fi

