<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Task Executor visual</title>
  <desc id="desc">A public scheduler diagram showing GitHub Actions dispatching drain and cache refresh jobs to private application endpoints.</desc>
  <rect width="1600" height="900" fill="#0f172a"/>
  <rect x="92" y="80" width="1416" height="740" rx="34" fill="#111827" stroke="#334155" stroke-width="3"/>
  <text x="138" y="164" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Task Executor</text>
  <text x="140" y="214" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="28">GitHub Actions schedules public jobs; private app code performs the work</text>

  <rect x="146" y="304" width="304" height="344" rx="28" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <text x="194" y="370" fill="#eff6ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Actions</text>
  <text x="194" y="420" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">cron schedule</text>
  <text x="194" y="462" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">manual dispatch</text>
  <text x="194" y="504" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">workflow health</text>

  <path d="M484 476 H624" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <path d="M604 452 L642 476 L604 500 Z" fill="#60a5fa"/>

  <rect x="668" y="276" width="330" height="400" rx="30" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="722" y="346" fill="#ecfdf5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Workers</text>
  <rect x="722" y="392" width="220" height="58" rx="16" fill="#bbf7d0"/>
  <text x="754" y="429" fill="#064e3b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">queue drain</text>
  <rect x="722" y="478" width="220" height="58" rx="16" fill="#bbf7d0"/>
  <text x="754" y="515" fill="#064e3b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">cache refresh</text>
  <text x="722" y="598" fill="#d1fae5" font-family="Arial, Helvetica, sans-serif" font-size="23">bounded retries</text>

  <path d="M1032 476 H1172" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  <path d="M1152 452 L1190 476 L1152 500 Z" fill="#34d399"/>

  <rect x="1216" y="304" width="236" height="344" rx="28" fill="#f8fafc"/>
  <text x="1254" y="370" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Private app</text>
  <rect x="1254" y="424" width="160" height="40" rx="12" fill="#dbeafe"/>
  <rect x="1254" y="496" width="160" height="40" rx="12" fill="#dcfce7"/>
  <text x="1254" y="594" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">logic stays private</text>

  <text x="138" y="760" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">schedule -> worker -> private endpoint -> workflow status</text>
</svg>

